services:
  postgres:
    image: postgres:16-alpine
    container_name: depf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: depf
      POSTGRES_PASSWORD: depf_local_dev
      POSTGRES_DB: depf
    ports:
      - "55432:5432"
    volumes:
      - depf_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U depf"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: depf_redis
    restart: unless-stopped
    ports:
      - "56379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - depf_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  depf_pg_data:
  depf_redis_data:
